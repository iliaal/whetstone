name: CLI regression checks

on:
  pull_request:
    paths:
      - "src/**"
      - "plugins/whetstone/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run CLI tests
        run: bun test
      - name: Build CLI
        run: bun build src/index.ts --target=bun --outfile="$RUNNER_TEMP/whetstone.js"
